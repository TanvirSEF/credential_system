name: secure-personal-vault

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env}
        STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
        STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
    image: secure-personal-vault:${APP_VERSION:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env}
        STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
        STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
    env_file:
      - .env
    command: ["pnpm", "db:migrate"]

  rls:
    profiles: ["tools"]
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env}
        STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
        STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
    env_file:
      - .env
    command: ["pnpm", "db:rls"]
